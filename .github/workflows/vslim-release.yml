name: VSlim Release

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Optional release version embedded in manually built bundles
        required: false
        default: ''
        type: string
      bundle_target:
        description: Bundle target to build during manual dispatch
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-amd64
          - macos-amd64
          - macos-arm64
          - windows-amd64
      macos_runner:
        description: macOS version for manually dispatched jobs
        required: false
        default: '15'
        type: choice
        options:
          - '15'
          - '26'
  push:
    branches:
      - main
    paths:
      - 'vslim/**'
      - 'vphp/**'
      - 'vphptest/run-tests.php'
      - '.github/workflows/vslim-release.yml'
    tags:
      - 'vslim-*'
  pull_request:
    paths:
      - 'vslim/**'
      - 'vphp/**'
      - 'vphptest/run-tests.php'
      - '.github/workflows/vslim-release.yml'

env:
  V_REF: local-dev
  V_COMMIT: 00a5393cc698e52e94dd1ff53f615ef65f854c7d

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux amd64 bundle
            runs_on: ubuntu-latest
            platform: linux-amd64
            package_type: binary
            extension_file: vslim.so
            artifact_name: vslim-linux-amd64-binary
            needs_build: true
            emit_only: false
          - name: linux arm64 bundle
            runs_on: ubuntu-24.04-arm
            platform: linux-arm64
            package_type: binary
            extension_file: vslim.so
            artifact_name: vslim-linux-arm64-binary
            needs_build: true
            emit_only: false
          - name: linux amd64 PHP 8.6 compatibility
            runs_on: ubuntu-latest
            platform: linux-amd64
            php-version: '8.6'
            package_type: binary
            extension_file: vslim.so
            needs_build: true
            verify_only: true
          - name: macos amd64 bundle
            runs_on: ${{ inputs.macos_runner == '26' && 'macos-26-intel' || 'macos-15-intel' }}
            platform: macos-amd64
            package_type: binary
            extension_file: vslim.so
            artifact_name: vslim-macos-amd64-binary
            needs_build: true
            emit_only: false
          - name: macos arm64 bundle
            runs_on: ${{ inputs.macos_runner == '26' && 'macos-26' || 'macos-15' }}
            platform: macos-arm64
            package_type: binary
            extension_file: vslim.so
            artifact_name: vslim-macos-arm64-binary
            needs_build: true
            emit_only: false
          - name: windows amd64 bundle
            runs_on: windows-2022
            platform: windows-amd64
            package_type: binary
            extension_file: php_vslim.dll
            artifact_name: vslim-windows-amd64-binary
            needs_build: true
            emit_only: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version || '8.5' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version || '8.5' }}
          coverage: none
          extensions: zip

      - name: Setup V
        if: matrix.needs_build && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "$V_REF" https://github.com/guweigang/vlang.git "$RUNNER_TEMP/vlang"
          git -C "$RUNNER_TEMP/vlang" checkout "$V_COMMIT"
          make -C "$RUNNER_TEMP/vlang"
          echo "$RUNNER_TEMP/vlang" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vlang/v" version

      - name: Setup MSVC on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          toolset: '14.44'

      - name: Setup V on Windows
        if: matrix.needs_build && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "vlang"
          git clone --branch $env:V_REF https://github.com/guweigang/vlang.git $installRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $installRoot checkout $env:V_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $installRoot "makev.bat") -msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $installRoot
          & (Join-Path $installRoot "v.exe") version

      - name: Install Windows parser tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          & $pythonExe -m pip install --user --disable-pip-version-check winflexbison-bin re2c
          $userScripts = (& $pythonExe -c "import sysconfig; print(sysconfig.get_path('scripts', scheme='nt_user'))").Trim()
          Add-Content -Path $env:GITHUB_PATH -Value $userScripts
          $env:Path = "$userScripts;$env:Path"
          $winBison = Join-Path $userScripts "win_bison.exe"
          $winFlex = Join-Path $userScripts "win_flex.exe"
          if (Test-Path $winBison) {
            Copy-Item -Force $winBison (Join-Path $userScripts "bison.exe")
          }
          if (Test-Path $winFlex) {
            Copy-Item -Force $winFlex (Join-Path $userScripts "flex.exe")
          }
          bison --version
          re2c --version

      - name: Install MariaDB client SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install libmariadb:x64-windows cjson:x64-windows
          $sdkRoot = Join-Path $env:RUNNER_TEMP "vcpkg\installed\x64-windows"
          $mysqlRoot = $sdkRoot
          $cjsonRoot = $sdkRoot
          Add-Content -Path $env:GITHUB_ENV -Value "VSLIM_MYSQL_ROOT=$mysqlRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "VSLIM_CJSON_ROOT=$cjsonRoot"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            patchelf \
            pkg-config \
            libcjson-dev \
            libssl-dev \
            libsodium-dev \
            libargon2-dev \
            libmariadb-dev \
            libmariadb-dev-compat

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install pkg-config cjson openssl@3 libsodium argon2 mysql

      - name: Build VSlim extension
        if: matrix.package_type == 'binary' && runner.os != 'Windows'
        working-directory: vslim
        shell: bash
        env:
          VPHP_V_GC: none
        run: |
          if [ "${{ matrix.platform }}" = linux-arm64 ]; then
            test "$(uname -m)" = aarch64
            test "$(php -r 'echo php_uname(chr(109));')" = aarch64
          fi
          make build
          if [ "${{ matrix.platform }}" = linux-arm64 ]; then
            readelf -h vslim.so | grep -Eq 'Machine:.*AArch64'
          fi

      - name: Build VSlim extension on Windows
        if: runner.os == 'Windows' && matrix.package_type == 'binary'
        working-directory: vslim
        shell: pwsh
        env:
          VPHP_V_GC: none
          VPHP_V_USE_OPENSSL: 1
          VPHP_V_NO_VSCHANNEL: 1
        run: |
          & cl
          & nmake /?
          & v.exe -cc msvc -path ".;..;@vlib" run build.v -emit-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\build_windows_dll.ps1

      - name: Run architecture scan and PHPT smoke tests
        if: matrix.package_type == 'binary' && runner.os != 'Windows'
        working-directory: vslim
        shell: bash
        run: |
          v test tests/boundary_scan_test.v
          TEST_PHP_EXECUTABLE="$(command -v php)" php ../vphptest/run-tests.php -q --show-all -d extension=./${{ matrix.extension_file }} \
            tests/test_vslim_database_bundle_smoke.phpt \
            tests/test_vslim_config_toml.phpt \
            tests/test_vslim_container_lazy_proxy.phpt \
            tests/test_vslim_psr7_psr17_interface_contracts.phpt \
            tests/test_vslim_psr7_uri_copy.phpt \
            tests/test_vslim_psr6_clock_integration.phpt \
            tests/test_vslim_psr16_clock_integration.phpt \
            tests/test_vslim_psr14_contracts.phpt \
            tests/test_vslim_request_state.phpt \
            tests/test_vslim_stream_response.phpt \
            tests/test_vslim_stream_static_factory.phpt \
            tests/test_vslim_stub_generator.phpt \
            tests/test_vslim_template_project_metadata.phpt

      - name: Run architecture scan and PHPT smoke tests on Windows
        if: matrix.package_type == 'binary' && runner.os == 'Windows'
        working-directory: vslim
        shell: pwsh
        env:
          VSLIM_CLI_DEBUG_FILE: ${{ runner.temp }}\vslim-cli-debug.log
        run: |
          & v.exe -cc msvc test tests/boundary_scan_test.v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEST_PHP_EXECUTABLE = (Get-Command php).Source
          $extension = (Resolve-Path ".\${{ matrix.extension_file }}").Path
          $sdkBin = Join-Path $env:VSLIM_MYSQL_ROOT "bin"
          $env:PATH = "$(Split-Path -Parent $extension);$sdkBin;$env:PATH"
          php -n -d "extension=$extension" --ri vslim
          if ($LASTEXITCODE -ne 0) {
            & dumpbin /DEPENDENTS $extension
            exit 1
          }
          $exitCode = 0
          php ..\vphptest\run-tests.php -n -q --show-all -d "extension=$extension" `
            tests/test_vslim_database_bundle_smoke.phpt `
            tests/test_vslim_cli_enum_input_types.phpt `
            tests/test_vslim_cli_nested_invocation.phpt `
            tests/test_vslim_config_toml.phpt `
            tests/test_vslim_container_lazy_proxy.phpt `
            tests/test_vslim_psr7_psr17_interface_contracts.phpt `
            tests/test_vslim_psr7_uri_copy.phpt `
            tests/test_vslim_psr6_clock_integration.phpt `
            tests/test_vslim_psr16_clock_integration.phpt `
            tests/test_vslim_request_state.phpt `
            tests/test_vslim_template_project_metadata.phpt
          if ($LASTEXITCODE -ne 0) {
            $exitCode = $LASTEXITCODE
          }
          if (Test-Path $env:VSLIM_CLI_DEBUG_FILE) {
            Write-Host "==== VSlim CLI debug log ===="
            Get-Content $env:VSLIM_CLI_DEBUG_FILE
          }
          exit $exitCode

      - name: Build release bundle
        if: ${{ !matrix.verify_only && runner.os != 'Windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        working-directory: vslim
        shell: bash
        env:
          VSLIM_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.bundle_version || github.sha }}
        run: |
          if [ "${{ matrix.package_type }}" = "binary" ]; then
            php scripts/package_release.php \
              --version="${VSLIM_RELEASE_VERSION}" \
              --platform="${{ matrix.platform }}" \
              --package-type=binary \
              --format=zip \
              --ext-path="./${{ matrix.extension_file }}"
          else
            php scripts/package_release.php \
              --version="${VSLIM_RELEASE_VERSION}" \
              --platform="${{ matrix.platform }}" \
              --package-type=source \
              --format=zip
          fi

      - name: Build release bundle on Windows
        if: runner.os == 'Windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        working-directory: vslim
        shell: pwsh
        env:
          VSLIM_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.bundle_version || github.sha }}
        run: |
          php scripts/package_release.php `
            --version="${env:VSLIM_RELEASE_VERSION}" `
            --platform="${{ matrix.platform }}" `
            --package-type=binary `
            --format=zip `
            --ext-path=".\${{ matrix.extension_file }}"

      - name: Upload bundle artifact
        if: ${{ !matrix.verify_only && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: vslim/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --draft \
              --title "VSlim $TAG_NAME" \
              --notes "VSlim release bundles for PHP 8.5 across Linux and macOS amd64/arm64, and Windows amd64."
          shopt -s globstar nullglob
          files=(dist/**/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release bundles found."
            exit 1
          fi
          gh release upload "$TAG_NAME" "${files[@]}" --clobber
